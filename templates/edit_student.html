{% extends "base.html" %}

{% block title %}Редактирование учащегося{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-gear"></i> Редактирование учащегося
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('edit_student', student_id=student.id) }}">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Фамилия <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="last_name" 
                                   value="{{ student.last_name }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Имя <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="first_name" 
                                   value="{{ student.first_name }}" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Отчество</label>
                            <input type="text" class="form-control" name="middle_name" 
                                   value="{{ student.middle_name or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Дата рождения</label>
                            <input type="date" class="form-control" name="birth_date" 
                                   value="{{ student.birth_date.strftime('%Y-%m-%d') if student.birth_date else '' }}">
                        </div>
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Адрес</label>
                            <input type="text" class="form-control" name="address" 
                                   value="{{ student.address or '' }}">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Родитель</label>
                            <input type="text" class="form-control" name="parent_name" 
                                   value="{{ student.parent_name or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Телефон родителя</label>
                            <input type="text" class="form-control" name="parent_phone" 
                                   value="{{ student.parent_phone or '' }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Класс <span class="text-danger">*</span></label>
                        <select class="form-select" name="class_id" required>
                            <option value="">Выберите класс</option>
                            {% for cls in classes %}
                            <option value="{{ cls.id }}" {% if cls.id == student.class_id %}selected{% endif %}>
                                {{ cls.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Сохранить изменения
                        </button>
                        <a href="{{ url_for('students') }}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
